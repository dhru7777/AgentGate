<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleLabsBot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c45c26'/%3E%3Cpath d='M8 21V11l8 7 8-7v10' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">M</span><strong>MapleLabsBot</strong><span class="muted">test crawler</span></div>
  <div class="site"><span class="dot"></span><span id="site">…</span></div>
</header>
<main class="split">
  <section class="pane chat">
    <div class="pane-title">The bot <span class="muted">what it asks and what it does</span></div>
    <div class="modes" id="modes"></div>
    <div class="thread" id="thread"></div>
    <form class="composer" id="form">
      <label class="check"><input type="checkbox" id="respect" checked> Respect robots.txt</label>
      <div class="row">
        <input id="q" autocomplete="off" placeholder="Ask it something about the blog…" required>
        <button id="send" type="submit">Send</button>
      </div>
      <div class="suggest" id="suggest"></div>
    </form>
  </section>
  <section class="pane site-pane">
    <div class="pane-title">The site <span class="muted">what the gate sees, live</span></div>
    <div class="card">
      <div class="card-h">Policy for MapleLabsBot</div>
      <div class="seg" id="policy">
        <button data-mode="free">Free</button><button data-mode="charge">Charge</button><button data-mode="block">Block</button>
      </div>
      <div class="hint" id="policyHint"></div>
    </div>
    <div class="card">
      <div class="card-h">Journey of the last request</div>
      <div class="flow" id="flow">
        <div class="node" data-k="robots">robots.txt</div><i>→</i>
        <div class="node" data-k="llms">llms.txt</div><i>→</i>
        <div class="node" data-k="sitemap">sitemap.xml</div><i>→</i>
        <div class="node" data-k="post">post</div>
      </div>
      <div class="kpis"><div><b id="kReq">0</b><span>requests</span></div><div><b id="kOk">0</b><span>served</span></div><div><b id="kBlock">0</b><span>blocked 402</span></div></div>
    </div>
    <div class="card grow">
      <div class="card-h">What the gate logged <span class="muted" id="logState"></span></div>
      <div class="table-wrap"><table id="log"><thead><tr><th>Time</th><th>Purpose</th><th>Path</th><th>Status</th><th>robots.txt</th></tr></thead><tbody></tbody></table></div>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
